# Semantic Blueprint — Show Me skill
# Zone: opinionated (config locked, output divergent)

skill: show-me
zone: opinionated
version: 0.1.0

scene_goal: >
  Make the current topic easier to understand by presenting its structure,
  behavior, or visual appearance in the smallest useful visual form.

participants:
  - name: explainer
    role: Agent
    description: The agent selecting and producing a concise visual explanation.
  - name: topic
    role: Patient
    description: The current topic, code, behavior, or design the user wants to understand.
  - name: context
    role: Source
    description: Conversation details, code, file paths, and visual references that ground the representation.

action_to_complete:
  predicate: clarify_with_visual
  agent: explainer
  patient: topic
  preconditions:
    - A visual representation would make the topic clearer than prose alone.
    - The necessary context is available or uncertainty can be stated.
  postconditions:
    - The response includes the smallest useful visual representation.
    - Prose remains concise and the visual is placed next to its explanation.

output_schema:
  required_sections: []
  reporting_surface: task_appropriate_prose
  evidence_required: when_representing_specific_code_or_system_behavior
  evidence_format: file_path_or_conversation_context
  acceptance_criteria:
    - The visual matches the type of topic (pseudocode, call tree, component tree, file tree, Mermaid, diff, or HTML artifact).
    - Only relevant calls, files, props, states, and boundaries are included.
    - Visual artifacts are focused, responsive, and grounded in the product's design when applicable.

do_not_use_when:
  - A visual would add clutter rather than clarity.
  - The user asks for prose-only output.
